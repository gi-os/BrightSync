name: Check

# Compiles and tests without publishing anything.
#
# The point of this workflow is that a push to the default branch cuts a release, so the
# default branch is a bad place to find out that something doesn't compile. Any other branch
# runs this instead: the same build, minus the signing checks and the release.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          # Resolving light-common from GitHub Packages, which has no anonymous read. GPR_TOKEN
          # overrides when a dedicated secret exists; otherwise the run's own token is enough,
          # but it has to be passed explicitly — Gradle does not see it on its own.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          # Resolving light-common from GitHub Packages, which has no anonymous read. GPR_TOKEN
          # overrides when a dedicated secret exists; otherwise the run's own token is enough,
          # but it has to be passed explicitly — Gradle does not see it on its own.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightSync-check-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
